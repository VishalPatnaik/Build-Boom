    <script>
      // Suppress Vite HMR WebSocket errors in iframe / cloud container preview
      (function() {
        if (typeof window !== 'undefined') {
          var isWsError = function(msg) {
            if (!msg) return false;
            var str = typeof msg === 'string' ? msg : (msg.message || (msg.error && msg.error.message) || String(msg));
            return str.indexOf('WebSocket') !== -1 || str.indexOf('ws://') !== -1 || str.indexOf('wss://') !== -1 || str.indexOf('[vite]') !== -1;
          };

          var origConsoleError = console.error;
          console.error = function() {
            for (var i = 0; i < arguments.length; i++) {
              if (isWsError(arguments[i])) return;
            }
            origConsoleError.apply(console, arguments);
          };

          window.addEventListener('error', function(event) {
            if (isWsError(event && (event.message || event.error))) {
              if (event.preventDefault) event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            if (isWsError(event && (event.reason || (event.reason && event.reason.message)))) {
              if (event.preventDefault) event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            }
          });
        }
      })();
    </script>
